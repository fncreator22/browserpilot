<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attention Required! | Cloudflare</title>
  <style>
    body {
      background: #111827;
      color: #f3f4f6;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .challenge-card {
      background: #1f2937;
      border: 1px solid #374151;
      padding: 32px;
      border-radius: 12px;
      text-align: center;
      max-width: 480px;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      border-left-color: #38bdf8;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="challenge-card">
    <h2>Verify you are human</h2>
    <p>Please wait while we verify your browser security credentials.</p>
    <div id="challenge-running" class="cf-browser-verification">
      <div class="spinner"></div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAABBBBBBBBBB"></div>
    </div>
  </div>
</body>
</html>
