services:
  # ============================================================================
  # 1. Main Application & Worker Service (Next.js Standalone + BullMQ Worker)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browserpilot-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/browserpilot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - SCHEDULER_CRON_SECRET=${SCHEDULER_CRON_SECRET}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
      - DISABLE_WORKER=${DISABLE_WORKER:-false}
    volumes:
      - artifacts_data:/app/storage/artifacts
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ============================================================================
  # 2. Redis Service (Distributed BullMQ Job Queues & Pub/Sub)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: browserpilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. PostgreSQL Database (Optional Local Database for Self-Hosting / Offline)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: browserpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-browserpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-browserpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  artifacts_data:
