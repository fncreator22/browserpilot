version: "3.8"

services:
  # Redis service for BullMQ distributed queue and Pub/Sub event streaming
  redis:
    image: redis:7-alpine
    container_name: browserpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Next.js Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: browserpilot-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN}
    depends_on:
      redis:
        condition: service_healthy

  # Standalone Playwright Execution Worker (AWS ECS Fargate / Fly.io / Container)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: browserpilot-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WORKER_CONCURRENCY=5
      - ARTIFACT_STORAGE_PATH=/app/storage/artifacts
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN}
    volumes:
      - worker_artifacts:/app/storage/artifacts
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  worker_artifacts:
